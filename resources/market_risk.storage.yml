resources:
  schemas:
    market_risk:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: Market Risk Lakehouse - ECB FX rates, index prices, exposures, VaR / ES and backtesting.

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.market_risk.name}
      name: landing
      volume_type: MANAGED
      comment: Immutable landing files written by the ingestion task (ecb/, fred/, reference/).
